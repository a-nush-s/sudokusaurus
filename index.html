<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sudokusaurus</title>
    <link rel="stylesheet" href="sudoku.css">
    <script src="sudoku.js"></script>
</head>
<body>
    <div id="difficulty-screen">
        <img id="logo" src="assets/logo.png">
        <div id="difficulty-wrap">
            <img id="selectdifficulty" src="assets/selectdifficulty.png">
            <img id="easy-btn" src="assets/easy.png">
            <img id="medium-btn" src="assets/medium.png">
            <img id="hard-btn" src="assets/hard.png">
            <img id="expert-btn" src="assets/expert.png">
        </div>
    </div>
    <img id="logo" src="assets/logo.png">
    <div class="game-area">
        <div class="board-wrap">
            <img id="board" src="assets/board.png">
            <img id="tosleep" src="assets/tosleep.gif">
            <img id="walkingdone" src="assets/walking_done.png">
        </div>
        <div class="numbers">
                <img id="num1" src="assets/num_one.png">
                <img id="num2" src="assets/num_two.png">
                <img id="num3" src="assets/num_three.png">
                <img id="num4" src="assets/num_four.png">
                <img id="num5" src="assets/num_five.png">
                <img id="num6" src="assets/num_six.png">
                <img id="num7" src="assets/num_seven.png">
                <img id="num8" src="assets/num_eight.png">
                <img id="num9" src="assets/num_nine.png">
                <img id="s1" src="assets/select_one.png">
                <img id="s2" src="assets/select_two.png">
                <img id="s3" src="assets/select_three.png">
                <img id="s4" src="assets/select_four.png">
                <img id="s5" src="assets/select_five.png">
                <img id="s6" src="assets/select_six.png">
                <img id="s7" src="assets/select_seven.png">
                <img id="s8" src="assets/select_eight.png">
                <img id="s9" src="assets/select_nine.png">
                <img id="blank" src="assets/num_blank.png">
                <img id="selectb" src="assets/select_blank.png">
            </div>
    </div>
    <img id="eating" src="assets/dino_eating.gif">
    <img id="result-overlay" src="" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:1000; max-width:80vw; max-height:80vh;">
    <img id="result-btn" src="" style="display:none; position:fixed; top:350px; left:50%; transform:translate(-50%,-50%); z-index:1001; max-width:80vw; max-height:80vh; cursor:pointer;">
</body>
</html>
